<!doctype html><html lang=vi><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Localhost Monitor</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#0b1020;color:#fff;padding:20px}.container{max-width:1100px;margin:auto}h1{margin-bottom:5px}.status{color:#7dd3fc;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-bottom:20px}.card{background:#151c32;border:1px solid #26304d;border-radius:14px;padding:20px;box-shadow:0 10px 30px #0004}.card h2{margin:0 0 10px;color:#cbd5e1;font-size:18px}.value{font-size:36px;font-weight:700;margin:10px 0}.sub-text{color:#94a3b8;font-size:13px;margin-top:5px}.progress{height:12px;background:#273149;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;transition:width .4s;border-radius:20px}.cpu{background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}.ram{background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7)}.gpu{background:linear-gradient(90deg,#f43f5e,#fb923c)}.disk{background:linear-gradient(90deg,#10b981,#06b6d4)}.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}.info-box{background:#151c32;padding:15px;border-radius:12px;border:1px solid #26304d}.info-box span{display:block;color:#94a3b8;font-size:12px;margin-bottom:5px}.info-box strong{font-size:15px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:10px;text-align:left;border-bottom:1px solid #26304d;font-size:14px}th{color:#94a3b8;background:#1e293b}.process-card{grid-column:1/-1}</style></head><body><div class=container><h1>🖥️ Localhost Monitor</h1><div class=status id=status>Đang kết nối...</div><div class=grid><div class=card><h2>⚡ CPU Usage</h2><div class=value><span id=cpu>0</span>%</div><div class=progress><div id=cpuBar class="bar cpu"></div></div><div class=sub-text>Xung nhịp: <span id=cpuSpeed>0</span> GHz</div></div><div class=card><h2>🧠 RAM Usage</h2><div class=value><span id=ram>0</span>%</div><div class=progress><div id=ramBar class="bar ram"></div></div><div class=sub-text id=ramText>0 GB / 0 GB</div></div><div class=card><h2>🎮 GPU</h2><div id=gpuContainer>Đang tải...</div></div><div class=card><h2>💾 Disk Usage</h2><div id=diskContainer>Đang tải...</div></div></div><div class=info><div class=info-box><span>Hostname</span><strong id=hostname>-</strong></div><div class=info-box><span>CPU Cores</span><strong id=cores>-</strong></div><div class=info-box><span>Platform</span><strong id=platform>-</strong></div><div class=info-box><span>Uptime</span><strong id=uptime>-</strong></div></div><div class="card process-card"><h2>🔥 Top Processes (Tiến trình chiếm tài nguyên)</h2><table><thead><tr><th>Process Name</th><th>CPU %</th><th>RAM %</th></tr></thead><tbody id=processTable></tbody></table></div></div><script>const G=e=>document.getElementById(e),GB=b=>(b/1073741824).toFixed(2),UP=s=>{let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;return`${d}d ${h}h${Math.floor(s/60)}m`};async function update(){try{let d=await(await fetch("/api/stats")).json();G("cpu").textContent=d.cpu.percent;G("cpuBar").style.width=d.cpu.percent+"%";G("cpuSpeed").textContent=d.cpu.speed;G("ram").textContent=d.ram.percent;G("ramBar").style.width=d.ram.percent+"%";G("ramText").textContent=`${GB(d.ram.used)} GB / ${GB(d.ram.total)} GB`;G("hostname").textContent=d.hostname;G("cores").textContent=d.cpu.cores;G("platform").textContent=d.platform;G("uptime").textContent=UP(d.uptime);G("gpuContainer").innerHTML=d.gpu.map(g=>`<div style="margin-bottom:10px"><div><strong>${g.model}</strong>: ${g.load}\%</div><div class="progress"><div class="bar gpu" style="width:${g.load}%"></div></div></div>`).join("");G("diskContainer").innerHTML=d.disk.map(k=>`<div style="margin-bottom:10px"><div><strong>${k.fs}</strong>: ${k.percent}\% (${GB(k.used)}GB / ${GB(k.size)}GB)</div><div class="progress"><div class="bar disk" style="width:${k.percent}%"></div></div></div>`).join("");G("processTable").innerHTML=d.processes.map(p=>`<tr><td>${p.name}</td><td>${p.cpu}\%</td><td>${p.mem}%</td></tr>`).join("");G("status").textContent="🟢 Đang theo dõi realtime"}catch(e){G("status").textContent="🔴 Không kết nối được localhost"}}update();setInterval(update,2e3);</script></body></html>
