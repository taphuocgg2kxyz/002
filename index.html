<!doctype html><html lang=vi><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Localhost Monitor</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#0b1020;color:#fff;padding:30px}.container{max-width:1000px;margin:auto}h1{margin-bottom:8px}.status{color:#7dd3fc;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:#151c32;border:1px solid #26304d;border-radius:18px;padding:25px;box-shadow:0 10px 30px #0004}.card h2{margin-top:0;color:#cbd5e1}.value{font-size:42px;font-weight:bold;margin:15px 0}.progress{height:15px;background:#273149;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;transition:width .4s;border-radius:20px}.cpu{background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}.ram{background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7)}.info{margin-top:25px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.info-box{background:#151c32;padding:20px;border-radius:14px;border:1px solid #26304d}.info-box span{display:block;color:#94a3b8;font-size:13px;margin-bottom:7px}.info-box strong{font-size:17px}@media(max-width:700px){.grid{grid-template-columns:1fr}.info{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=container><h1>🖥️ Localhost Monitor</h1><div class=status id=status>Đang kết nối...</div><div class=grid><div class=card><h2>⚡ CPU</h2><div class=value><span id=cpu>0</span>%</div><div class=progress><div id=cpuBar class="bar cpu"></div></div></div><div class=card><h2>🧠 RAM</h2><div class=value><span id=ram>0</span>%</div><div class=progress><div id=ramBar class="bar ram"></div></div><p id=ramText>0 GB / 0 GB</p></div></div><div class=info><div class=info-box><span>Hostname</span><strong id=hostname>-</strong></div><div class=info-box><span>CPU Cores</span><strong id=cores>-</strong></div><div class=info-box><span>Platform</span><strong id=platform>-</strong></div><div class=info-box><span>Uptime</span><strong id=uptime>-</strong></div></div></div><script>const G=e=>document.getElementById(e),GB=b=>(b/1073741824).toFixed(2),UP=s=>{let d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;return`${d}d ${h}h ${Math.floor(s/60)}m`};async function update(){try{let d=await(await fetch("/api/stats")).json(),c=d.cpu.toFixed(1),r=d.ram.percent.toFixed(1);G("cpu").textContent=c;G("cpuBar").style.width=c+"%";G("ram").textContent=r;G("ramBar").style.width=r+"%";G("ramText").textContent=`${GB(d.ram.used)} GB / ${GB(d.ram.total)} GB`;G("hostname").textContent=d.hostname;G("cores").textContent=d.cores;G("platform").textContent=d.platform;G("uptime").textContent=UP(d.uptime);G("status").textContent="🟢 Đang theo dõi realtime"}catch(e){G("status").textContent="🔴 Không kết nối được localhost"}}update();setInterval(update,1e3)</script></body></html>
